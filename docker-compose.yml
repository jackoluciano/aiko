services:
  core-service:
    build: ./core-service
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/aiko.db
    volumes:
      - aiko_data:/data
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      core-service:
        condition: service_healthy
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    mem_limit: 64m
    cpus: 0.25

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel run --token ${TUNNEL_TOKEN}
    depends_on:
      - gateway
    dns:
      - 1.1.1.1
      - 8.8.8.8
    mem_limit: 128m
    cpus: 0.25

volumes:
  aiko_data:
