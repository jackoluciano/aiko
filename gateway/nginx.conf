limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}

server {
  listen 80;
  server_tokens off;
  client_max_body_size 1m;

  location = /gateway-health {
    default_type application/json;
    return 200 '{"gateway":"ok"}';
  }

  location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://core-service:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://core-service:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location / {
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND","message":"Gunakan /api/...","details":[]}}';
  }

  error_page 429 = @too_many;
  location @too_many {
    default_type application/json;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Terlalu banyak permintaan. Coba lagi nanti.","details":[]}}';
  }
}
